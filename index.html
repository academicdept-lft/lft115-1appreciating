<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感恩節筆友回顧｜Lead For Taiwan</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --yellow:#fdd04c; --blue:#244db6; --cream:#f4f2f0; --ink:#202020; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--yellow); color:var(--ink); min-height:100vh; }
  header { display:flex; justify-content:flex-end; align-items:center; padding:16px 24px; }
  .logo { width:88px; height:auto; }
  main { max-width:640px; margin:0 auto; padding:8px 20px 60px; }
  .screen { display:none; }
  .screen.active { display:block; animation:fade .4s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  .hero { text-align:center; padding:40px 0 20px; position:relative; }
  .hero h1 { font-size:34px; line-height:1.35; margin:0 0 14px; }
  .hero p { font-size:17px; line-height:1.8; margin:0 0 28px; }
  .deco { position:absolute; font-size:34px; pointer-events:none; }
  .d1 { top:0; left:4%; } .d2 { top:30px; right:6%; } .d3 { bottom:0; left:12%; }

  .btn { display:inline-block; background:var(--blue); color:#fff; border:none; border-radius:999px; padding:14px 32px; font-size:18px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .nav-link { color:var(--ink); font-size:14px; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit; margin-top:16px; }

  .card { background:var(--cream); border-radius:18px; padding:24px; margin-bottom:18px; box-shadow:0 4px 0 rgba(32,32,32,.12); }
  .card h2 { margin:0 0 6px; font-size:22px; }
  .card .sub { margin:0 0 16px; font-size:14px; color:#555; line-height:1.7; }
  label { display:block; font-weight:700; margin:14px 0 6px; }
  input, textarea { width:100%; font-family:inherit; font-size:16px; padding:12px 14px; border:2px solid #d8d4cf; border-radius:12px; background:#fff; color:var(--ink); }
  textarea { min-height:110px; resize:vertical; line-height:1.7; }
  input:focus, textarea:focus { outline:none; border-color:var(--blue); }
  .err { color:#b3261e; font-size:14px; margin-top:8px; min-height:18px; }
  .actions { text-align:center; margin-top:8px; }
  .counter { text-align:right; font-size:13px; color:#666; margin-top:6px; }

  .item-block { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; }
  .item-block .tag { font-size:13px; font-weight:700; color:var(--blue); margin-bottom:4px; }
  .item-block p { margin:0; line-height:1.8; white-space:pre-wrap; }

  .wait { text-align:center; padding:30px 0; line-height:1.9; }
  .done { text-align:center; padding:30px 0; }
  .done h2 { font-size:26px; }
  .done p { line-height:1.9; font-size:17px; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <!-- LFT logo：簡化線條版，正式上線前請換成官方 logo 檔 -->
  <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Lead For Taiwan">
    <g stroke="#202020" stroke-width="4" fill="none">
      <path d="M8 14 H112 V112"/>
      <path d="M112 14 L42 84"/>
    </g>
    <text x="8" y="92" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#202020">LEAD</text>
    <text x="8" y="110" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#202020">FOR TAIWAN</text>
  </svg>
</header>

<main>

  <!-- 首頁 -->
  <section id="home" class="screen active">
    <div class="hero">
      <span class="deco d1">🍁</span>
      <span class="deco d2">🎃</span>
      <span class="deco d3">🌾</span>
      <h1>感恩節，來說說<br>最近的心情吧</h1>
      <p>寫下一件最近煩惱的事、一件最近開心的事，<br>再用溫暖的文字回饋給另一位筆友。</p>
      <button class="btn" onclick="go('form')">開始感恩節回顧！</button>
    </div>
  </section>

  <!-- 填寫頁 -->
  <section id="form" class="screen">
    <div class="card">
      <h2>留下你的心情</h2>
      <p class="sub">你的 Email 只用於寄送回饋信件。</p>
      <label for="name">名字</label>
      <input id="name" maxlength="20" placeholder="例如：小寶">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">
      <label for="worry">最近煩惱的事</label>
      <textarea id="worry" maxlength="300" placeholder="最近讓你有點累或擔心的事……"></textarea>
      <label for="happy">最近開心的事</label>
      <textarea id="happy" maxlength="300" placeholder="最近讓你笑出來的小事……"></textarea>
      <div class="err" id="formErr"></div>
      <div class="actions">
        <button class="btn" id="submitBtn" onclick="submitForm()">送出，去找一位筆友</button>
      </div>
    </div>
    <div style="text-align:center"><button class="nav-link" onclick="go('home')">返回首頁</button></div>
  </section>

  <!-- 等待配對 -->
  <section id="waiting" class="screen">
    <div class="card wait">
      <span style="font-size:48px">🍂</span>
      <h2>還在等待配對</h2>
      <p>目前還沒有可以配對的內容，請稍後再按一次「重新查看」。</p>
      <div class="actions">
        <button class="btn" onclick="checkAssignment()">重新查看</button>
      </div>
    </div>
  </section>

  <!-- 回饋頁 -->
  <section id="review" class="screen">
    <div class="card">
      <h2>回饋一位筆友</h2>
      <p class="sub">請閱讀對方的煩惱與開心事件，試圖用溫暖的文字回饋給對方，對方將會收到你的回饋信件唷！</p>
      <div class="item-block">
        <div class="tag">TA 的煩惱</div>
        <p id="pWorry"></p>
      </div>
      <div class="item-block">
        <div class="tag">TA 的開心</div>
        <p id="pHappy"></p>
      </div>
      <label for="feedback">你的回饋</label>
      <textarea id="feedback" maxlength="500" oninput="updateCount()" placeholder="寫下你想對 TA 說的話，例如：謝謝你願意分享，也希望你……"></textarea>
      <div class="counter"><span id="count">0</span> / 500 字</div>
      <div class="err" id="reviewErr"></div>
      <div class="actions">
        <button class="btn" id="sendBtn" onclick="sendFeedback()" disabled>送出回饋</button>
      </div>
    </div>
  </section>

  <!-- 完成頁 -->
  <section id="done" class="screen">
    <div class="card done">
      <span style="font-size:48px">🦃</span>
      <h2>謝謝你的回饋！</h2>
      <p>感謝你的回饋，回饋會以 Email 寄給作者、當你的事件被回饋後也會收到一封回饋信件喔！</p>
      <div class="actions">
        <button class="btn" onclick="checkAssignment()">再回饋一位筆友</button>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
  // 部署 Apps Script 後，把網址貼在這裡
  const API_URL = 'https://script.google.com/macros/s/AKfycby29WlXrQIRoUR3kDc768cFekoD6POrRQBQAmWNArR0yqQ1-kk0uHN53tIFhPjZRDE/exec';

  let myId = localStorage.getItem('lft_my_id') || '';
  let target = null;

  function go(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function val(id) {
    return document.getElementById(id).value.trim();
  }

  // 以 text/plain 送出，避免跨網域的預檢請求（Apps Script 常見做法）
  async function api(action, data) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, data))
    });
    return res.json();
  }

  async function submitForm() {
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('formErr');
    const data = { name: val('name'), email: val('email'), worry: val('worry'), happy: val('happy') };

    if (!data.name || !data.email || !data.worry || !data.happy) {
      err.textContent = '請填寫所有欄位。';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      err.textContent = 'Email 格式好像不太對，再檢查一下喔。';
      return;
    }

    err.textContent = '';
    btn.disabled = true;
    try {
      const r = await api('submit', data);
      if (!r.ok) { err.textContent = r.error; return; }
      myId = r.id;
      localStorage.setItem('lft_my_id', myId);
      if (r.assignment) showReview(r.assignment);
      else go('waiting');
    } catch (e) {
      err.textContent = '網路好像有點問題，請稍後再試。';
    } finally {
      btn.disabled = false;
    }
  }

  async function checkAssignment() {
    if (!myId) { go('form'); return; }
    try {
      const r = await api('assign', { id: myId });
      if (!r.ok) { toast(r.error); return; }
      if (r.assignment) showReview(r.assignment);
      else go('waiting');
    } catch (e) {
      toast('網路好像有點問題，請稍後再試。');
    }
  }

  function showReview(a) {
    target = a;
    document.getElementById('pWorry').textContent = a.worry;
    document.getElementById('pHappy').textContent = a.happy;
    document.getElementById('feedback').value = '';
    document.getElementById('reviewErr').textContent = '';
    updateCount();
    go('review');
  }

  function updateCount() {
    const len = document.getElementById('feedback').value.length;
    document.getElementById('count').textContent = len;
    document.getElementById('sendBtn').disabled = len < 10;
  }

  async function sendFeedback() {
    const btn = document.getElementById('sendBtn');
    const err = document.getElementById('reviewErr');
    const text = val('feedback');
    if (text.length < 10) {
      err.textContent = '再多寫一點溫暖的話吧（至少 10 字）。';
      return;
    }
    btn.disabled = true;
    err.textContent = '';
    try {
      const r = await api('feedback', { id: myId, targetId: target.id, text });
      if (!r.ok) { err.textContent = r.error; return; }
      go('done');
    } catch (e) {
      err.textContent = '網路好像有點問題，請稍後再試。';
    } finally {
      updateCount();
    }
  }
</script>
</body>
</html>
